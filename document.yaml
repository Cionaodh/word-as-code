# Порядок разделов статьи.
input-files:
  - src/00_header.md
  - src/01_intro.md
  - src/02_data.md
  - src/03_model.md
  - src/04_results.md
  - src/05_conclusion.md
  - src/06_references.md
from: markdown
to: docx
output-file: article.docx
standalone: true
reference-doc: reference.docx
filters: # обработчики
  - pandoc-crossref # для нумерации рисунков и таблиц
  - citeproc # для списка литературы
bibliography: references.bib
csl: gost.csl
fail-if-warnings: true
metadata:
  lang: ru-RU
  figureTitle: Рис.
  tableTitle: Таблица
  figPrefix: рис.
